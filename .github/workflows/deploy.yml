name: Deploy

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm ci
      - run: npm run lint
      - run: npm run test:scripts
      # React Doctor reports a codebase-health score. The CLI is version-pinned,
      # but the score is computed server-side by react.doctor and can move with
      # no code change on our side — it fell from 98 to 84 between two deploys
      # while the tree only got cleaner. We keep it as a visible health signal
      # but do NOT block production deploys on a third-party number we can't
      # control. Target stays 90 for awareness; a low score warns, never fails.
      - name: React Doctor health check (non-blocking)
        continue-on-error: true
        run: |
          TARGET=90
          RAW="$(npx -y react-doctor@0.0.31 . --score)"
          SCORE="$(printf '%s' "$RAW" | grep -Eo '[0-9]+' | tail -1)"
          if [ -z "$SCORE" ]; then
            echo "::warning::Unable to parse React Doctor score from: $RAW"
            exit 0
          fi
          echo "React Doctor score: $SCORE/100 (target $TARGET)"
          echo "### React Doctor: $SCORE/100 (target $TARGET)" >> "$GITHUB_STEP_SUMMARY"
          if [ "$SCORE" -lt "$TARGET" ]; then
            echo "::warning::React Doctor score $SCORE is below the target of $TARGET — health signal only, not blocking deploy"
            npx -y react-doctor@0.0.31 . --verbose || true
          fi
      - run: npm run build
        env:
          NEXT_PUBLIC_FORM_ENDPOINT: ${{ secrets.NEXT_PUBLIC_FORM_ENDPOINT }}
          NEXT_PUBLIC_APP_URL: ${{ vars.NEXT_PUBLIC_APP_URL || 'https://www.shelf.nu' }}
          NEXT_PUBLIC_POSTHOG_KEY: ${{ secrets.NEXT_PUBLIC_POSTHOG_KEY }}
          NEXT_PUBLIC_POSTHOG_HOST: https://us.i.posthog.com
          NEXT_PUBLIC_CRISP_WEBSITE_ID: ${{ secrets.NEXT_PUBLIC_CRISP_WEBSITE_ID }}
      # `npm run build` already runs the offline half of this check (raw markdown
      # leaking into rendered pages). This step adds the network half: every
      # <img> the site ships, including frontmatter `image:` fields that feed
      # OG/social previews. Kept separate from the build so a supabase blip
      # can't fail a deploy — the script warns on network errors, retries 429
      # and 5xx with backoff, and fails only on a definitive 4xx (or a 429/5xx
      # that never clears). Capped at 6 concurrent fetches: on 2026-10-19 the
      # old 12-wide burst tripped storage rate limits twice (runs 39241743448
      # and 39256690071), red deploys that passed on a plain rerun.
      - name: Verify images resolve
        timeout-minutes: 10
        run: npm run content:verify:images

      - name: Snapshot content changes
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        run: node scripts/snapshot-content.mjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      # Cloudflare Pages sometimes rejects the publish with "Unknown internal
      # error occurred" (repeatedly on 2026-10-12). A later attempt has always
      # gone through, so try up to three times with pauses instead of leaving
      # main undeployed until someone re-runs the job.
      - uses: cloudflare/wrangler-action@v3
        id: deploy
        continue-on-error: true
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # The action's default is wrangler 3.90.0 (Nov 2024).
          wranglerVersion: "4.143.0"
          command: pages deploy out --project-name=shelf-nu
      - name: Wait before retrying the deploy
        if: steps.deploy.outcome == 'failure'
        run: sleep 60
      - uses: cloudflare/wrangler-action@v3
        id: deploy_retry
        if: steps.deploy.outcome == 'failure'
        continue-on-error: true
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # The action's default is wrangler 3.90.0 (Nov 2024).
          wranglerVersion: "4.143.0"
          command: pages deploy out --project-name=shelf-nu
      # On 2026-10-12 a retry one minute later could still fail while a
      # manual re-run a few minutes later went through, so the last attempt
      # waits longer.
      - name: Wait before the last deploy attempt
        if: steps.deploy.outcome == 'failure' && steps.deploy_retry.outcome == 'failure'
        run: sleep 180
      - uses: cloudflare/wrangler-action@v3
        id: deploy_last
        if: steps.deploy.outcome == 'failure' && steps.deploy_retry.outcome == 'failure'
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.143.0"
          command: pages deploy out --project-name=shelf-nu
      # Tell Bing (and so Copilot) which pages this push changed, instead of
      # waiting days for its crawler. The checkout is one commit deep, so fetch
      # the previous main commit to diff against. Never fails the job: the
      # site is already live by now.
      - name: Send changed pages to IndexNow
        if: >-
          github.event_name == 'push' && github.ref == 'refs/heads/main' &&
          (steps.deploy.outcome == 'success' || steps.deploy_retry.outcome == 'success' || steps.deploy_last.outcome == 'success')
        continue-on-error: true
        env:
          BEFORE_SHA: ${{ github.event.before }}
          # Same origin the build wrote into the sitemap, or no URL would match.
          NEXT_PUBLIC_APP_URL: ${{ vars.NEXT_PUBLIC_APP_URL || 'https://www.shelf.nu' }}
        run: |
          git fetch --no-tags --depth=1 origin "$BEFORE_SHA" || true
          node scripts/indexnow.mjs --changed "$BEFORE_SHA" "$GITHUB_SHA"
      - name: Comment preview URL on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          DEPLOY_URL: ${{ steps.deploy.outputs.deployment-url || steps.deploy_retry.outputs.deployment-url || steps.deploy_last.outputs.deployment-url }}
        with:
          script: |
            const body = `### Preview deployment\n\n${process.env.DEPLOY_URL}`;
            const { data: comments } = await github.rest.issues.listComments({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
            });
            const existing = comments.find(c =>
              c.user.type === 'Bot' && c.body.includes('Preview deployment')
            );
            if (existing) {
              await github.rest.issues.updateComment({
                comment_id: existing.id,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body,
              });
            }
