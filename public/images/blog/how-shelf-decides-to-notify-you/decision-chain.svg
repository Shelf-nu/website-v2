<svg xmlns="http://www.w3.org/2000/svg" width="760" height="560" viewBox="0 0 760 560" color="#18181b" role="img" aria-label="Five questions in a straight line decide whether a push is sent. Each no leaves the line and stops; only the last yes sends." font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="currentColor">
  <rect x="0.5" y="0.5" width="759" height="559" rx="12" fill="#ffffff" stroke="#e4e4e7"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="currentColor"/>
    </marker>
  </defs>

  <!-- entry -->
  <text x="40" y="34" font-weight="600">Something happened that is about you</text>
  <line x1="200" y1="44" x2="200" y2="70" stroke="currentColor" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- question boxes, 40px apart on a 100px rhythm -->
  <g stroke="currentColor" stroke-width="1.5" fill="none">
    <rect x="40" y="70" width="320" height="56" rx="6"/>
    <rect x="40" y="170" width="320" height="56" rx="6"/>
    <rect x="40" y="270" width="320" height="56" rx="6"/>
    <rect x="40" y="370" width="320" height="56" rx="6"/>
    <rect x="40" y="470" width="320" height="56" rx="6"/>
  </g>
  <text x="200" y="94" text-anchor="middle" font-weight="600">1. Does the workspace's plan include push?</text>
  <text x="200" y="113" text-anchor="middle" opacity="0.7">Self-hosted installs: always yes</text>

  <text x="200" y="194" text-anchor="middle" font-weight="600">2. Are you still a member of that workspace?</text>
  <text x="200" y="213" text-anchor="middle" opacity="0.7">Checked when it is sent, not when it happened</text>

  <text x="200" y="294" text-anchor="middle" font-weight="600">3. Are your switches on?</text>
  <text x="200" y="313" text-anchor="middle" opacity="0.7">The master switch and the category's switch</text>

  <text x="200" y="394" text-anchor="middle" font-weight="600">4. Do you have a signed-in phone?</text>
  <text x="200" y="413" text-anchor="middle" opacity="0.7">A device that has not been signed out or retired</text>

  <text x="200" y="494" text-anchor="middle" font-weight="600">5. Send it</text>
  <text x="200" y="513" text-anchor="middle" opacity="0.7">One push per device, through Expo</text>

  <!-- yes arrows down -->
  <g stroke="currentColor" stroke-width="1.5" marker-end="url(#arrow)">
    <line x1="200" y1="126" x2="200" y2="170"/>
    <line x1="200" y1="226" x2="200" y2="270"/>
    <line x1="200" y1="326" x2="200" y2="370"/>
    <line x1="200" y1="426" x2="200" y2="470"/>
  </g>
  <g font-size="11" opacity="0.7">
    <text x="208" y="152">yes</text>
    <text x="208" y="252">yes</text>
    <text x="208" y="352">yes</text>
    <text x="208" y="452">yes</text>
  </g>

  <!-- no exits to the right -->
  <g stroke="currentColor" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#arrow)">
    <line x1="360" y1="98" x2="430" y2="98"/>
    <line x1="360" y1="198" x2="430" y2="198"/>
    <line x1="360" y1="298" x2="430" y2="298"/>
    <line x1="360" y1="398" x2="430" y2="398"/>
  </g>
  <g font-size="11" opacity="0.7">
    <text x="388" y="92" text-anchor="middle">no</text>
    <text x="388" y="192" text-anchor="middle">no</text>
    <text x="388" y="292" text-anchor="middle">no</text>
    <text x="388" y="392" text-anchor="middle">no</text>
  </g>
  <g>
    <text x="440" y="94" font-weight="600">Stop.</text>
    <text x="440" y="111" opacity="0.8">Nobody in the workspace gets push.</text>
    <text x="440" y="194" font-weight="600">Stop.</text>
    <text x="440" y="211" opacity="0.8">You left that workspace.</text>
    <text x="440" y="294" font-weight="600">Stop.</text>
    <text x="440" y="311" opacity="0.8">You said no to this kind of push.</text>
    <text x="440" y="394" font-weight="600">Stop.</text>
    <text x="440" y="411" opacity="0.8">The email still reaches you.</text>
  </g>

  <!-- after send -->
  <g font-size="11" opacity="0.8">
    <text x="440" y="486">Phone says it is gone: that device is retired.</text>
    <text x="440" y="503">Network hiccup: try again in a minute, twice.</text>
    <text x="440" y="520">Delivery receipts are checked 15 minutes later.</text>
  </g>
  <line x1="360" y1="498" x2="430" y2="498" stroke="currentColor" stroke-width="1.5" marker-end="url(#arrow)"/>
</svg>
