<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Should we send a notification? Five boxes in a straight line, the last one highlighted." font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" color="#18181b" fill="currentColor">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="currentColor"/></marker>
  </defs>
  <rect width="1200" height="630" fill="#fff7ed"/>
  <!-- everything sits inside the middle 840px, so a card that crops the sides to 4:3 keeps it -->
  <text x="600" y="185" font-size="50" font-weight="700" letter-spacing="-1" text-anchor="middle">Should we send a notification?</text>
  <text x="600" y="232" font-size="24" fill="#52525b" text-anchor="middle">Slack needed a flowchart. Shelf needs five questions in a line.</text>
  <g stroke="currentColor" stroke-width="2.5" fill="#ffffff">
    <rect x="225" y="330" width="130" height="80" rx="10"/>
    <rect x="380" y="330" width="130" height="80" rx="10"/>
    <rect x="535" y="330" width="130" height="80" rx="10"/>
    <rect x="690" y="330" width="130" height="80" rx="10"/>
    <rect x="845" y="330" width="130" height="80" rx="10" stroke="#ea580c" stroke-width="3.5"/>
  </g>
  <g font-size="19" font-weight="600" text-anchor="middle">
    <text x="290" y="377">Plan?</text>
    <text x="445" y="377">Member?</text>
    <text x="600" y="377">Switches?</text>
    <text x="755" y="377">Phone?</text>
    <text x="910" y="377" fill="#ea580c">Send</text>
  </g>
  <g stroke="currentColor" stroke-width="2.5" marker-end="url(#a)">
    <line x1="355" y1="370" x2="380" y2="370"/>
    <line x1="510" y1="370" x2="535" y2="370"/>
    <line x1="665" y1="370" x2="690" y2="370"/>
    <line x1="820" y1="370" x2="845" y2="370"/>
  </g>
  <g stroke="currentColor" stroke-width="2" stroke-dasharray="6 6" marker-end="url(#a)">
    <line x1="290" y1="410" x2="290" y2="462"/>
    <line x1="445" y1="410" x2="445" y2="462"/>
    <line x1="600" y1="410" x2="600" y2="462"/>
    <line x1="755" y1="410" x2="755" y2="462"/>
  </g>
  <g font-size="17" fill="#52525b" text-anchor="middle">
    <text x="290" y="490">no: stop</text>
    <text x="445" y="490">no: stop</text>
    <text x="600" y="490">no: stop</text>
    <text x="755" y="490">no: stop</text>
  </g>
</svg>
